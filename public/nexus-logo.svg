<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <!-- Icon mark (scaled down, left-aligned) -->
  <!-- Amber connection lines -->
  <line x1="40" y1="40" x2="18.4" y2="19.2" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="41.6" y2="10.4" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="59.6" y2="16.8" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="69.6" y2="43.2" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="60.8" y2="64.8" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="17.6" y2="62.4" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="11.2" y2="41.6" stroke="#E8A020" stroke-width="2" stroke-linecap="round"/>

  <!-- Satellite nodes -->
  <circle cx="18.4" cy="19.2" r="6.4" fill="#0A1628"/>
  <circle cx="41.6" cy="10.4" r="4" fill="#4A6FA5"/>
  <circle cx="59.6" cy="16.8" r="5.6" fill="#4A6FA5"/>
  <circle cx="69.6" cy="43.2" r="4" fill="#4A6FA5"/>
  <circle cx="60.8" cy="64.8" r="6" fill="#0A1628"/>
  <circle cx="17.6" cy="62.4" r="4.8" fill="#4A6FA5"/>
  <circle cx="11.2" cy="41.6" r="3.6" fill="#4A6FA5"/>

  <!-- Central hub -->
  <circle cx="40" cy="40" r="8.8" fill="#0A1628"/>
  <circle cx="40" cy="40" r="5.2" fill="white"/>

  <!-- Wordmark: NEXUS -->
  <text
    x="90"
    y="52"
    font-family="'Inter', 'DM Sans', system-ui, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="3"
    fill="#0A1628"
  >NEXUS</text>
